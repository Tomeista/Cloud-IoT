# Job configuration injected as environment variables. Kept separate from the
# flink-conf ConfigMap below: `envFrom` turns every key into an env var name,
# and a key like "flink-conf.yaml" is not a valid one, so kubelet would skip it
# and emit an InvalidVariableNames warning.
apiVersion: v1
kind: ConfigMap
metadata:
  name: flink-env
  namespace: iot-monitoring
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_EVENTS_TOPIC: "sensor-events"
  KAFKA_AGGREGATES_TOPIC: "sensor-aggregates"
  KAFKA_ALERTS_TOPIC: "sensor-alerts"
  KAFKA_LATE_TOPIC: "sensor-late-events"
  METADATA_PATH: "/opt/flink/job/metadata.json"
  ALLOWED_LATENESS_SECONDS: "30"
  CHECKPOINT_INTERVAL_SECONDS: "30"
  FLINK_PARALLELISM: "2"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flink-conf
  namespace: iot-monitoring
data:
  flink-conf.yaml: |
    jobmanager.rpc.address: flink-jobmanager
    jobmanager.rpc.port: 6123
    # Pin the BLOB server instead of letting it take a random port. TaskManagers
    # fetch the job's artefacts from the JobManager through the Service, and a
    # Service only forwards ports it declares -- on a random port the fetch
    # fails, the tasks never leave CREATED and the job sits in RUNNING
    # processing nothing.
    blob.server.port: 6124
    jobmanager.memory.process.size: 1024m
    taskmanager.memory.process.size: 1024m
    taskmanager.numberOfTaskSlots: 2
    parallelism.default: 2
    rest.port: 8081
    rest.bind-address: ::
    env.java.opts: -Djava.net.preferIPv6Addresses=true
    # Checkpointing is enabled in job.py. No `state.checkpoints.dir` is set, so
    # Flink keeps checkpoints in the JobManager's memory: enough to recover the
    # alerting state and Kafka offsets when a TaskManager dies or the job
    # restarts, but not across a JobManager restart.
    state.backend: hashmap
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
  namespace: iot-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink
      component: jobmanager
  template:
    metadata:
      labels:
        app: flink
        component: jobmanager
    spec:
      containers:
        - name: jobmanager
          image: iot-monitoring/flink-job:latest
          imagePullPolicy: IfNotPresent
          args: ["jobmanager"]
          ports:
            - containerPort: 6123
              name: rpc
            - containerPort: 6124
              name: blob
            - containerPort: 8081
              name: webui
          envFrom:
            - configMapRef:
                name: flink-env
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: flink-config-volume
              mountPath: /opt/flink/conf/flink-conf.yaml
              subPath: flink-conf.yaml
      volumes:
        - name: flink-config-volume
          configMap:
            name: flink-conf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
  namespace: iot-monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flink
      component: taskmanager
  template:
    metadata:
      labels:
        app: flink
        component: taskmanager
    spec:
      containers:
        - name: taskmanager
          image: iot-monitoring/flink-job:latest
          imagePullPolicy: IfNotPresent
          args: ["taskmanager"]
          envFrom:
            - configMapRef:
                name: flink-env
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: flink-config-volume
              mountPath: /opt/flink/conf/flink-conf.yaml
              subPath: flink-conf.yaml
      volumes:
        - name: flink-config-volume
          configMap:
            name: flink-conf
---
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
  namespace: iot-monitoring
spec:
  ports:
    - port: 6123
      targetPort: 6123
      name: rpc
    - port: 6124
      targetPort: 6124
      name: blob
    - port: 8081
      targetPort: 8081
      name: webui
  selector:
    app: flink
    component: jobmanager
---
# Submits the PyFlink job, so `kubectl apply` alone brings up a *processing*
# pipeline rather than an idle Flink cluster waiting for a manual `flink run`.
# Delete and re-apply this Job to resubmit after a job.py change:
#   kubectl -n iot-monitoring delete job flink-job-submit
apiVersion: batch/v1
kind: Job
metadata:
  name: flink-job-submit
  namespace: iot-monitoring
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: flink
        component: job-submit
    spec:
      restartPolicy: OnFailure
      containers:
        - name: submit
          image: iot-monitoring/flink-job:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: flink-env
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              JM=flink-jobmanager:8081

              # The Job may start before the JobManager serves REST. `flink
              # list` doubles as the readiness check, so this needs no extra
              # tooling in the image.
              until flink list -m "$JM" > /dev/null 2>&1; do
                echo "waiting for JobManager at $JM ..."
                sleep 5
              done

              # Match on the state in parentheses, not just the name: `flink
              # list -r` files CANCELLING and FAILING jobs under "Running/
              # Restarting" too, so a plain name match would treat a job on its
              # way out as healthy and skip the submission, leaving the cluster
              # with no pipeline at all.
              if flink list -m "$JM" -r 2>/dev/null \
                   | grep -qE "IoT Sensor Monitoring Pipeline \((RUNNING|RESTARTING)\)"; then
                echo "Job already running, nothing to submit."
                exit 0
              fi

              # -d detaches: a streaming job never returns, and without it this
              # pod would run forever and the Job would never complete.
              exec flink run -d -m "$JM" -py /opt/flink/job/job.py
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
