# IoT Sensor Monitoring - Helm Values
# Override these values for your deployment

namespace: iot-monitoring

# Container image registry (set to your registry)
imageRegistry: "iot-monitoring"
imagePullPolicy: IfNotPresent

# Frontend
frontend:
  replicas: 2
  image: frontend
  tag: latest
  service:
    type: NodePort
    port: 80
    nodePort: 30080
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

# Backend (FastAPI)
backend:
  replicas: 2
  image: backend
  tag: latest
  service:
    port: 8000
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

# Sensor data simulator - continuous producer that feeds Kafka.
# Reuses the backend image (sensor_simulator.py is baked in at /app).
# The fleet comes from the sensor catalogue shipped at /app/metadata.json --
# the same file the Flink job enriches against -- so there is no sensor count
# to configure here.
simulator:
  replicas: 1
  interval: 1.0
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

# Apache Kafka
kafka:
  replicas: 1
  image: confluentinc/cp-kafka
  tag: "7.6.1"
  storage: 5Gi
  # Topics are auto-created; the broker default of 1 partition would cap the
  # whole pipeline at one consumer per group, making extra Flink TaskManagers
  # and backend replicas pure overhead. Three partitions give scaling something
  # to work with.
  numPartitions: 3
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# Zookeeper (required by Kafka)
zookeeper:
  replicas: 1
  image: confluentinc/cp-zookeeper
  tag: "7.6.1"
  storage: 1Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Apache Flink
flink:
  # Must match env.execute(...) in flink-job/job.py: the submit Job uses this
  # name to detect an already-running pipeline and skip re-submitting.
  jobName: "IoT Sensor Monitoring Pipeline"
  parallelism: 2
  # Windows accept stragglers for this long past the watermark; later events go
  # to the late-events topic instead of being dropped silently.
  allowedLatenessSeconds: 30
  checkpointIntervalSeconds: 30
  jobmanager:
    replicas: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "1Gi"
        cpu: "1000m"
  taskmanager:
    replicas: 2
    taskSlots: 2
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "1Gi"
        cpu: "1000m"
  image: flink-job
  tag: latest

# SeaweedFS (S3-compatible object storage)
seaweedfs:
  replicas: 1
  image: chrislusf/seaweedfs
  tag: "3.80"
  storage: 10Gi
  s3Port: 8333
  credentials:
    accessKey: seaweedadmin
    secretKey: seaweedadmin
  bucket: iot-lakehouse
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Kafka topic configuration
kafka_topics:
  events: sensor-events
  aggregates: sensor-aggregates
  alerts: sensor-alerts
  # Events that missed their window even after the allowed lateness.
  late: sensor-late-events
